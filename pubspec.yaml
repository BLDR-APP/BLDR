  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  sizer: ^3.1.3
  shared_preferences: ^2.2.2
  dio: ^5.7.0
  home_widget: ^0.7.0
  live_activities: ^2.0.0
  connectivity_plus: ^7.0.0
  fl_chart: ^1.1.1
  fluttertoast: ^8.2.4
  google_fonts: ^6.1.0
  supabase_flutter: ^2.5.6
  image_picker: ^1.2.0
  path_provider: ^2.1.2
  provider: ^6.1.5+1
  postgrest: ^2.4.2
  path: ^1.8.3
  share_plus: ^12.0.0
  file_picker: ^10.3.3
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  pdf: ^3.10.4
  printing: ^5.11.0
  csv: ^5.0.2

  # 👇 precisa adicionar para compressão e formatação de data
  flutter_image_compress: ^2.2.0
  intl: ^0.20.2
  
  # Stripe payment integration
  flutter_stripe: ^10.1.1
  flutter_stripe_web: ^5.2.0
  http: ^1.2.0

  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3

  # Platform dependencies
  web: any
  video_player: any
  mobile_scanner: any
  speech_to_text: 7.3.0

  universal_html: ^2.2.4
  model_viewer_plus: ^1.9.3
  muscle_selector: ^1.0.4
  flutter_muscle_anatomy: ^1.2.7
  flutter_localization: ^0.3.3
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.1.1
  vibration: ^3.1.4
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  pinput: ^5.0.2
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  in_app_purchase: ^3.3.0
  in_app_purchase_storekit: ^0.4.11
  purchases_flutter: ^10.10.1
  purchases_ui_flutter: ^10.10.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  watch_connectivity: ^0.2.4
  device_preview: ^1.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

  # Dependency injection (Clean Architecture)
  get_it: ^8.0.3
  flutter_tabler_icons: ^1.43.0

  # Deep link capture (callbacks genéricos de deep link)
  app_links: ^6.4.0

  # OAuth via ASWebAuthenticationSession — funciona em simulador e device real
  flutter_web_auth_2: ^4.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/whoop/
    - assets/models/
    - assets/images/categories/
    - assets/images/muscle_map/base/
    - assets/images/muscle_map/front_masks/
    - assets/images/muscle_map/back_masks/
  #   - images/a_dot_ham.jpeg

  # Inter empacotado localmente para o design system (lib/theme/bldr_tokens.dart).
  # Necessário porque BldrText usa `fontFamily: 'Inter'`, que não resolve via
  # google_fonts. Pesos: 400/500/600 — os únicos que os tokens declaram.
  # Licença SIL OFL 1.1 em assets/fonts/LICENSE.txt.
  # O legado (AppTheme) continua usando GoogleFonts; os dois coexistem.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  # Fallback para versões muito antigas do Android
  image_path: "assets/images/bldr_logo.png"

  # Configuração para Android 8.0+ (Ícones Adaptativos)
  adaptive_icon_background: "#000000" # Fundo preto puro
  adaptive_icon_foreground: "assets/images/bldr_logo.png" # Sua logo

  # An image asset can refer to one or more resolution-variant files of
  # the same file without the variant specifier. The file name
  # must be prefixed with the type variant folder name: eg. assets/font/
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this format:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

# ── Flutter Native Splash ────────────────────────────────────────────────────
# Cor idêntica ao AppTheme.primaryBlack e ao LaunchScreen iOS — zero flash.
# Rodar após alterar: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0D0D0D"
  image: assets/images/BLDR_CLEAN_BGLESS.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#0D0D0D"
    image: assets/images/BLDR_CLEAN_BGLESS.png
